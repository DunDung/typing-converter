<!-- EmailJS template draft. Existing callers pass nickname and comment. -->
<!-- Subject: [알림] {{nickname}} -->
<!-- Keep the existing fixed recipient; do not use a client-supplied recipient. -->
<div lang="ko" style="margin:0;padding:28px 16px;background:#f5f6fb;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#172239;">
  <table role="presentation" style="width:100%;max-width:600px;margin:0 auto;border-collapse:collapse;background:#ffffff;border:1px solid #e4e7ef;">
    <tr>
      <td style="padding:28px 28px 20px;border-top:4px solid #394fca;">
        <p style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:1px;color:#53649c;">새 알림</p>
        <h1 style="margin:0;font-size:22px;line-height:1.5;">{{nickname}}</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:0 28px 28px;">
        <div style="padding:20px;background:#f7f8fc;border:1px solid #e8eaf2;font-size:16px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;">{{comment}}</div>
      </td>
    </tr>
  </table>
</div>
